name: Build & Release Android APK (ARM64)

on:
  workflow_dispatch:
    inputs:
      release_version:
        description: 'Tag versi rilis Android (contoh: v0.5.0-android-alpha)'
        required: true
        default: 'v0.5.0-android-alpha'
        type: string
      build_mode:
        description: 'Mode build: auto (full jika secret+enc ada, else smoke), full-standalone, atau runtime-smoke'
        required: true
        default: 'auto'
        type: choice
        options:
          - auto
          - full-standalone
          - runtime-smoke
      publish_release:
        description: 'Publikasikan langsung ke GitHub Releases'
        required: true
        default: 'false'
        type: string
  push:
    branches:
      - main
    tags:
      - 'v*-android*'

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-android-apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Sync Pinned Upstream dod3-recomp & ps3recomp + Apply Android Patches
        run: |
          bash tools/sync_upstream.sh

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle 8.10.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Install Android NDK 27.2.12479018 & CMake 3.22.1
        run: |
          SDK_ROOT="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          if [[ -z "$SDK_ROOT" || ! -d "$SDK_ROOT" ]]; then
            echo "::error::ANDROID_HOME / ANDROID_SDK_ROOT tidak ditemukan pada runner."
            exit 1
          fi
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --sdk_root="$SDK_ROOT" --licenses > /dev/null || true
          "$SDKMANAGER" --sdk_root="$SDK_ROOT" \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "ndk;27.2.12479018" \
            "cmake;3.22.1"

      - name: Determine Build Mode & Lift PPU/SPU (If Standalone)
        id: mode
        env:
          PS3_CI_KEY: ${{ secrets.PS3_CI_KEY }}
          REQ_MODE: ${{ inputs.build_mode || 'auto' }}
        run: |
          HAS_ENC=false
          if [[ -f "ci/EBOOT_101.ELF.enc" && -f "ci/libsre.prx.enc" && -n "$PS3_CI_KEY" ]]; then
            HAS_ENC=true
          fi

          if [[ "$REQ_MODE" == "full-standalone" ]]; then
            if [[ "$HAS_ENC" != "true" ]]; then
              echo "::error::Mode full-standalone memerlukan ci/EBOOT_101.ELF.enc, ci/libsre.prx.enc, dan secret PS3_CI_KEY."
              exit 1
            fi
            SMOKE="OFF"
          elif [[ "$REQ_MODE" == "runtime-smoke" ]]; then
            SMOKE="ON"
          else
            if [[ "$HAS_ENC" == "true" ]]; then
              SMOKE="OFF"
            else
              SMOKE="ON"
            fi
          fi
          echo "smoke=$SMOKE" >> "$GITHUB_OUTPUT"
          echo "Selected DOD3_ANDROID_RUNTIME_SMOKE=$SMOKE"

          if [[ "$SMOKE" == "OFF" ]]; then
            mkdir -p upstream/elf upstream/out/v101 upstream/recompiled_101 upstream/ps3recomp/fw_spu
            key_file="$RUNNER_TEMP/ps3_ci.key"
            trap 'rm -f "$key_file"' EXIT
            printf '%s' "$PS3_CI_KEY" > "$key_file"
            chmod 600 "$key_file"

            openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 \
              -in ci/EBOOT_101.ELF.enc -out upstream/elf/EBOOT_101.ELF -pass "file:$key_file"
            openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 \
              -in ci/libsre.prx.enc -out upstream/ps3recomp/fw_spu/libsre.prx -pass "file:$key_file"
            rm -f "$key_file"

            python3 -m venv upstream/.venv
            upstream/.venv/bin/pip install -r upstream/ps3recomp/tools/requirements.txt -r upstream/tools/requirements.txt

            (
              cd upstream
              .venv/bin/python ps3recomp/tools/ppu_loader.py elf/EBOOT_101.ELF -o out/v101/
              .venv/bin/python ps3recomp/tools/ppu_lifter.py elf/EBOOT_101.ELF \
                --functions out/v101/EBOOT_101.functions.json \
                --hle-stubs out/v101/EBOOT_101.imports.json \
                --code-end 0x157fc00 \
                --nonvolatile-locals \
                --hook 0x000C1E50 --hook 0x00EE7728 --hook 0x00272E58 \
                -o recompiled_101/
              bash tools/lift_spu.sh
            )
          fi

      - name: Prepare APK Release Keystore (Optional)
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASS: ${{ secrets.ANDROID_KEYSTORE_PASS }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASS: ${{ secrets.ANDROID_KEY_PASS }}
        run: |
          if [[ -n "$ANDROID_KEYSTORE_BASE64" ]]; then
            echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            {
              echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/release.jks"
              echo "ANDROID_KEYSTORE_PASS=$ANDROID_KEYSTORE_PASS"
              echo "ANDROID_KEY_ALIAS=$ANDROID_KEY_ALIAS"
              echo "ANDROID_KEY_PASS=$ANDROID_KEY_PASS"
            } >> "$GITHUB_ENV"
          else
            echo "::warning::ANDROID_KEYSTORE_BASE64 tidak diset; APK akan menggunakan debug keystore Android."
          fi

      - name: Resolve Version
        id: ver
        run: |
          VERSION="${{ inputs.release_version || github.ref_name }}"
          if [[ -z "$VERSION" || "$VERSION" == "main" ]]; then
            VERSION="v0.5.0-android-alpha"
          fi
          CLEAN_NAME="${VERSION#v}"
          echo "tag=$VERSION" >> "$GITHUB_OUTPUT"
          echo "name=$CLEAN_NAME" >> "$GITHUB_OUTPUT"

      - name: Fetch Third-Party Sources (SDL2, glslang, SPIRV-Tools, SPIRV-Headers)
        working-directory: android
        run: |
          gradle fetchThirdParty --stacktrace --no-daemon

      - name: Build Android ARM64 APK (SDL2 + Vulkan + glslang + libmain.so)
        working-directory: android
        run: |
          gradle assembleRelease \
            -Pdod3RuntimeSmoke=${{ steps.mode.outputs.smoke }} \
            -PversionCode=${{ github.run_number }} \
            -PversionName=${{ steps.ver.outputs.name }} \
            --stacktrace --no-daemon

      - name: Package Release Assets & SHA-256 Checksums
        run: |
          mkdir -p release-dist
          APK_SRC=$(find android/app/build/outputs/apk/release -name "*.apk" | head -n 1)
          TAG="${{ steps.ver.outputs.tag }}"
          SUFFIX="arm64-v8a"
          if [[ "${{ steps.mode.outputs.smoke }}" == "ON" ]]; then
            SUFFIX="smoke-arm64-v8a"
          fi
          cp "$APK_SRC" "release-dist/Dod3Recomp-${TAG}-${SUFFIX}.apk"
          (cd release-dist && sha256sum * > SHA256SUMS)
          ls -lh release-dist

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dod3-android-arm64-apk-${{ steps.ver.outputs.tag }}
          path: release-dist/*
          if-no-files-found: error

      - name: Publish GitHub Release
        if: ${{ inputs.publish_release == 'true' || startsWith(github.ref, 'refs/tags/v') }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          name: "Drakengard 3 Android ARM64 ${{ steps.ver.outputs.tag }}"
          prerelease: true
          generate_release_notes: true
          files: |
            release-dist/*.apk
            release-dist/SHA256SUMS
